
<!DOCTYPE html>
<html>
<head>
    <!-- Inline -->
<p style="display: inline; background-color: yellow;">This is inline text inside a paragraph.</p>
<!-- Block -->
<div style="display: block; background-color: lightblue;">
  I am a block element. Even at 50% width, nothing can sit next to me.
</div>
<!-- Inline-Block -->
<div style="display: inline-block; width: 100px; height: 100px; background: pink; margin: 5px;">Box 1</div>
<div style="display: inline-block; width: 100px; height: 100px; background: lightgreen; margin: 5px;">Box 2</div>
    <!-- Flex -->
<div style="display: flex; justify-content: space-between; background-color: #eee; padding: 10px;">
  <div>Left Side</div>
  <div>Middle Content</div>
  <div>Right Side</div>
</div>
<!-- Grid -->
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px;">
  <div style="background: tomato; padding: 20px;">Sidebar (Narrow)</div>
  <div style="background: gold; padding: 20px;">Main Content (Wide)</div>
</div>
</head>
</html>
