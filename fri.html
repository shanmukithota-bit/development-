<!DOCTYPE html>
<html>
<head>
    <title>html5 web page</title>

    <style>
        body {
            font-family: Arial;
        }

        header {
            background-color: #243e5a;
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0 0 25px;
        }

        nav a {
            color: lightblue;
            margin-right: 20px;
        }

        main {
            width: 900px;
            margin: 20px auto;
        }

        .content {
            width: 650px;
            float: left;
        }

        .box {
            background-color: #243e5a;
            color: white;
            padding: 30px;
        }

        .side {
            background-color: #f0f4f8;
            padding: 20px;
            width: 200px;
            float: right;
        }

        .image {
            width: 215px;
            height: 85px;
            background-color: #ffd166;
        }

        footer {
            clear: both;
            background-color: #243e5a;
            color: white;
            padding: 25px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Campus Daily</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">News</a>
            <a href="#">Events</a>
        </nav>
    </header>


    <!-- Main Content -->
    <main>

        <div class="content">

            <div class="box">
                <h2>Coding club wins hackathon</h2>
                <p>thota shanmuki</p>
            </div>

            <h3>The project</h3>

            <p>
                The team built a bus-tracking app in 24 hours.
            </p>

            <div class="image"></div>

            <p>Fig 1: The winning team.</p>

            <div class="box">
                <p>Filed under: <mark>Tech</mark></p>
            </div>

        </div>


        <!-- Right side -->
        <div class="side">
            <h3>Related</h3>

            <ul>
                <li>Robotics workshop</li>
                <li>Exam schedule</li>
            </ul>
        </div>

    </main>
    <footer>
        Contact:
        <a href="mailto:news@campus.edu">
            news@campus.edu
        </a>
    </footer>

</body>
</html>
