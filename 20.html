<!DOCTYPE html>
<html>
<head>
    <title>Qurt Restaurant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            margin: 30px;
        }

        h1 {
            text-align: center;
            color: #444;
        }

        .section {
            margin: 20px auto;
            width: 85%;
        }

        .title {
            background-color: orange;
            color: white;
            padding: 12px;
            font-size: 22px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #dce8b5;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .price {
            text-align: right;
        }
    </style>
</head>

<body>

    <h1>🍴 Qurt Restaurant 🍴</h1>

    <!-- Breakfast -->
    <div class="section">
        <div class="title">Breakfast</div>

        <table>
            <tr>
                <th>Item</th>
                <th class="price">Price</th>
            </tr>
            <tr>
                <td>idli</td>
                <td class="price">180</td>
            </tr>
            <tr>
                <td>dosa</td>
                <td class="price">₹150</td>
            </tr>
            <tr>
                <td>Paneer Dosa</td>
                <td class="price">₹90</td>
            </tr>
        </table>
    </div>

    <!-- Lunch Combo -->
    <div class="section">
        <div class="title">Lunch Combo</div>

        <table>
            <tr>
                <th>Items</th>
                <th class="price">Prices</th>
            </tr>
            <tr>
                <td>Veg Meals</td>
                <td class="price">₹110</td>
            </tr>
            <tr>
                <td>fried rice</td>
                <td class="price">₹100</td>
            </tr>
            <tr>
                <td>Paneer Butter Masala</td>
                <td class="price">₹160</td>
            </tr>
            <tr>
                <td>Dal Rice</td>
                <td class="price">80</td>
            </tr>
        </table>
    </div>

    <!-- Dinner -->
    <div class="section">
        <div class="title">supper</div>

        <table>
            <tr>
                <th>Item</th>
                <th class="price">Price</th>
            </tr>
            <tr>
                <td>Chapati</td>
                <td class="price">₹50</td>
            </tr>
            <tr>
                <td>Veg Fried Rice</td>
                <td class="price">90</td>
            </tr>
            <tr>
                <td>Paneer Curry</td>
                <td class="price">₹140</td>
            </tr>
        </table>
    </div>

</body>
</html>
