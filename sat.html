<!DOCTYPE html>
<html>
    <head>
        <title>webpage by hyper links and nav</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: left;
        }
        img{
            height: 300px;
            width: auto;
        }
        nav{
            border-style: dashed;
            padding: 15px;
            text-align: center;
            position: sticky;
        }
        nav a{ color: aqua;
              text-decoration: greenyellow;
        }
        nav a:hover{
            color:aquamarine;   
        }
        section{
            height:200px;
            padding:20px;
        }
        #college{
            background-color: gold;
        }
        #university{
            background-color:rgb(50, 231, 221);
        }
        html{
            scroll-behavior: smooth;
        }
       </style>
       </head>
           <nav>
            <a href="#college">COLLEGE</a>
            <a href="#university">UNIVERSITY</a>
           </nav>
               <section id="college">
                <h1>COLLEGE</h1>
                <P>College is used as smaller institution</P>
                <p>Has fewer departments and courses </p>
                <p>It has spacefic courses</p>
               </section>
            <section id="university">
                <h1>UNIVERSITY</h1>
                <p>University is the biggest institution</p>
                <p>Has more departments and courses</p>
                <p>It has more then specific courses</p> 
            </section>
        </body>
</html>
