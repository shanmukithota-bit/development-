<!DOCTYPE html>
<html>
<head>
    <title>college fest registration</title>
</head>
<style>
   body {
        background-color:aqua;
   }
   h1{
       text-align:center;
   }
</style>
<body>

    <h1>college fest registration</h1>

    <form>

        <label>Name:</label>
        <input type="text" name="name">
        <br><br>

        <label>College name:</label>
        <input type="text" name="college_name">
        <br><br>

        <label>place:</label>
        <input type="text" name="timings">
        <br><br>

        <label>programs conducted on:</label>
        <input type="date" name="programs">
        <br><br>

        <label>games:</label><br>
         <input type="radio">mind games<br>
            <input type="radio">quiz<br>
            <input type="checkbox">tennis<br>
            <input type="checkbox">kabaddi<br>
            <input type="checkbox">kho-kho<br>
        <br><br>

        <label>lunch timings:</label>
        <input  name="lunch_timings" type="time">
        <br><br>

        <label>participate any one of those programs:</label>
        <input type="checkbox" name="participate" value="yes">
        <br><br>

        <input type="submit" value="participate=yes">
        <input type="reset" value="Reset=no">

    </form>

</body>
</html>
