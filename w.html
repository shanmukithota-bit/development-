
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        form {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border: 2px solid blue;
            border-radius: 10px;
        }

        input, select {
            padding: 8px;
            margin: 8px;
            border: 1px solid gray;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            cursor: pointer;
        }

        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: darkblue;
            color: white;
        }

        tr:hover {
            background-color: lightyellow;
        }
    </style>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter your name"><br>

        <label>Roll Number:</label><br>
        <input type="text" placeholder="Enter roll number"><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter email"><br>

        <label>Branch:</label><br>
        <select>
            <option>Select Branch</option>
            <option>CSE</option>
            <option>CSM</option>
            <option>ECE</option>
            <option>EEE</option>
        </select><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female<br>

        <input type="submit" value="Register">
    </form>

    <h1>Student Details Table</h1>

    <table>
        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Branch</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Ravi</td>
            <td>CSE</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Sita</td>
            <td>CSM</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Rahul</td>
            <td>ECE</td>
        </tr>
    </table>

</body>
</html>
